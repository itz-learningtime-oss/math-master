name = "math-master-reminder"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Cron: run every 5 minutes so every reminder minute is caught within ~5 min.
# The Worker uses minute-of-day circular matching with a 5-minute window.
[triggers]
crons = ["*/5 * * * *"]

# KV namespace shared with the Pages project.
[[kv_namespaces]]
binding = "MATH_MASTER_KV"
id = "6583824284db470cbcbfe03a5ac79a5c"

# VAPID keys (VAPID_PRIVATE_KEY can be set as a secret; defaults also work in code)
[vars]
VAPID_SUBJECT = "mailto:www.itzlearningtime@gmail.com"
