name = "math-master-reminder"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Cron: run every 15 minutes to catch each user's scheduled reminder time
[triggers]
crons = ["*/15 * * * *"]

# NOTE: This file is only used if you deploy the reminder Worker via the Wrangler CLI.
# The recommended (CLI-free) way is to create the Worker in the Cloudflare dashboard,
# paste src/index.js, set the cron trigger, and bind the KV namespace + VAPID vars there.
#
# If you DO use wrangler, create the KV namespace and set its real id below:
#   npx wrangler kv namespace create MATH_MASTER_KV
[[kv_namespaces]]
binding = "MATH_MASTER_KV"
id = "YOUR_REAL_KV_NAMESPACE_ID"

# VAPID keys (set VAPID_PRIVATE_KEY as a secret, not in this file)
[vars]
VAPID_SUBJECT = "mailto:www.itzlearningtime@gmail.com"
