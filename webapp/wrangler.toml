# Cloudflare Pages project config for Math Master
# Docs: https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "math-master"

# The build output directory served by Pages
pages_build_output_dir = "./dist"

compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# NOTE: The KV namespace binding (MATH_MASTER_KV) is NOT defined here on purpose.
# It is configured in the Cloudflare dashboard instead (no CLI needed):
#   Pages → math-master → Settings → Functions → KV namespace bindings
#   Variable name: MATH_MASTER_KV → pick your namespace.

# VAPID public key used by the client to subscribe.
[vars]
VAPID_PUBLIC_KEY = "BI7Bmi6uZ8eJnKY-YFCtF5FJGs2zPA_D8zYwg6CR2SFJ6qLgmqdnDINTIx-lL_N5J1jJZNdVAnKmjbAXQPxcobc"

# VAPID_PRIVATE_KEY must be set as a secret in the dashboard:
#   Pages → math-master → Settings → Environment variables
